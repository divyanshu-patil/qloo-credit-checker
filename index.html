<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qloo Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000; --white: #fff; --canvas: #e5e5e5;
    --smoke: #979797; --slate: #444; --mint: #d1ffca; --yellow: #fff100; --orange: #ff6a3d;
    --cond: "Anton", "Bebas Neue", sans-serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; background: var(--canvas); color: var(--black); font: 500 16px/1.25 var(--sans); }
  main { width: 100%; max-width: 720px; display: grid; gap: 24px; }

  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
  .gh { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px; border-radius: 48px; background: var(--white); color: var(--black); font: 500 14px/1.3 var(--sans); text-decoration: none; }
  .gh:hover { background: var(--mint); }
  .gh img { border-radius: 50%; }
  .gh svg { width: 18px; height: 18px; fill: currentColor; }
  .tag { padding: 8px 16px; border-radius: 64px; background: var(--mint); font: 12px/1.3 var(--mono); letter-spacing: -0.03em; text-transform: uppercase; }
  h1 { font: 400 clamp(48px, 14vw, 130px)/0.9 var(--cond); letter-spacing: -0.03em; text-transform: uppercase; }

  form { display: flex; gap: 8px; padding: 8px; border-radius: 64px; background: var(--white); }
  form:focus-within { outline: 2px solid var(--black); outline-offset: 2px; }
  input { flex: 1; min-width: 0; padding: 16px 24px; border: 0; outline: none; background: none; color: var(--black); font: 500 18px var(--sans); }
  input::placeholder { color: var(--smoke); }
  button { padding: 0 32px; border: 0; border-radius: 64px; background: var(--orange); color: var(--black); font: 700 16px var(--sans); letter-spacing: -0.01em; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #f2532a; }
  button:disabled { background: var(--smoke); cursor: wait; }

  #status { justify-self: start; min-height: 1.6em; font: 12px/1.6 var(--mono); letter-spacing: -0.03em; color: var(--slate); }
  #status.err { padding: 0 8px; border-radius: 4px; background: var(--yellow); color: var(--black); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat { display: grid; gap: 24px; padding: 24px; border-radius: 32px; background: var(--white); }
  .stat.main { grid-column: 1 / -1; background: var(--black); color: var(--white); }
  .stat span { font: 12px/1.3 var(--mono); letter-spacing: -0.03em; text-transform: uppercase; color: var(--smoke); }
  .stat b { font: 400 clamp(48px, 12vw, 80px)/0.9 var(--cond); letter-spacing: -0.03em; }
  .stat.main b { font-size: clamp(64px, 18vw, 130px); }
</style>
</head>
<body>
<main>
  <header>
    <span class="tag">Qloo Hackathon API</span>
    <a class="gh" href="https://github.com/divyanshu-patil" target="_blank" rel="noopener">
      <img src="https://github.com/divyanshu-patil.png?size=64" alt="" width="28" height="28">
      divyanshu-patil
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>
  <h1>Credits<br>Checker</h1>
  <form id="form">
    <input id="key" type="password" placeholder="Paste API key" aria-label="Qloo API key" autocomplete="off" spellcheck="false" required>
    <button id="check">Check</button>
  </form>
  <p id="status" role="status"></p>
  <section class="stats" id="stats" hidden>
    <div class="stat main"><span>Credits remaining</span><b id="remaining"></b></div>
    <div class="stat"><span>Total credits</span><b id="total"></b></div>
    <div class="stat"><span>Days remaining</span><b id="days"></b></div>
  </section>
</main>
<script>
  const QLOO_BASE_URL = "https://hackathon.api.qloo.com";
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => v === null ? "—" : Number(v).toLocaleString();

  function setStatus(msg, err = false) {
    $("status").textContent = msg;
    $("status").className = err && msg ? "err" : "";
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = $("key").value.trim();
    if (!key) return;
    $("stats").hidden = true;
    $("check").disabled = true;
    setStatus("Checking…");
    try {
      // any authed call carries the quota headers; this one costs 1 credit (docs.qloo.com basic-insights-use-case example, take=1)
      const res = await fetch(`${QLOO_BASE_URL}/v2/insights/?filter.type=urn:entity:movie&filter.tags=urn:tag:genre:media:comedy&filter.release_year.min=2022&take=1`, { headers: { "X-Api-Key": key } });
      if (res.status === 401 || res.status === 403) throw new Error("Invalid API key");
      const remaining = res.headers.get("x-month-ratelimit-remaining");
      if (remaining === null) throw new Error(`No quota headers (HTTP ${res.status}): ${(await res.text()).slice(0, 200)}`);
      const resetSec = res.headers.get("x-month-ratelimit-reset");
      $("remaining").textContent = fmt(remaining);
      $("total").textContent = fmt(res.headers.get("x-month-ratelimit-limit"));
      $("days").textContent = resetSec === null ? "—" : Math.floor(resetSec / 86400);
      $("stats").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(err instanceof TypeError ? "Network error" : err.message, true);
    } finally {
      $("check").disabled = false;
    }
  });
</script>
</body>
</html>
