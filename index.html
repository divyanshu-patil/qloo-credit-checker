<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qloo Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000; --white: #fff; --canvas: #e5e5e5;
    --smoke: #979797; --slate: #444; --mint: #d1ffca; --yellow: #fff100;
    --cond: "Anton", "Bebas Neue", sans-serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; background: var(--canvas); color: var(--black); font: 500 16px/1.25 var(--sans); }
  main { width: 100%; max-width: 720px; display: grid; gap: 24px; }

  .tag { justify-self: start; padding: 8px 16px; border-radius: 64px; background: var(--mint); font: 12px/1.3 var(--mono); letter-spacing: -0.03em; text-transform: uppercase; }
  h1 { font: 400 clamp(48px, 14vw, 130px)/0.9 var(--cond); letter-spacing: -0.03em; text-transform: uppercase; }

  input { width: 100%; padding: 24px 32px; border: 0; border-radius: 64px; background: var(--white); color: var(--black); font: 500 18px var(--sans); }
  input::placeholder { color: var(--smoke); }
  input:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }

  #status { justify-self: start; min-height: 1.6em; font: 12px/1.6 var(--mono); letter-spacing: -0.03em; color: var(--slate); }
  #status.err { padding: 0 8px; border-radius: 4px; background: var(--yellow); color: var(--black); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat { display: grid; gap: 24px; padding: 24px; border-radius: 32px; background: var(--white); }
  .stat.main { grid-column: 1 / -1; background: var(--black); color: var(--white); }
  .stat span { font: 12px/1.3 var(--mono); letter-spacing: -0.03em; text-transform: uppercase; color: var(--smoke); }
  .stat b { font: 400 clamp(48px, 12vw, 80px)/0.9 var(--cond); letter-spacing: -0.03em; }
  .stat.main b { font-size: clamp(64px, 18vw, 130px); }
</style>
</head>
<body>
<main>
  <span class="tag">Qloo Hackathon API</span>
  <h1>Credits<br>Checker</h1>
  <form id="form">
    <input id="key" type="password" placeholder="Paste API key, press Enter" aria-label="Qloo API key" autocomplete="off" spellcheck="false" required>
  </form>
  <p id="status" role="status"></p>
  <section class="stats" id="stats" hidden>
    <div class="stat main"><span>Credits remaining</span><b id="remaining"></b></div>
    <div class="stat"><span>Total credits</span><b id="total"></b></div>
    <div class="stat"><span>Days remaining</span><b id="days"></b></div>
  </section>
</main>
<script>
  const QLOO_BASE_URL = "https://hackathon.api.qloo.com";
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => v === null ? "—" : Number(v).toLocaleString();

  function setStatus(msg, err = false) {
    $("status").textContent = msg;
    $("status").className = err && msg ? "err" : "";
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = $("key").value.trim();
    if (!key) return;
    $("stats").hidden = true;
    setStatus("Checking…");
    try {
      // any authed call carries the quota headers; this one costs 1 credit (docs.qloo.com basic-insights-use-case example, take=1)
      const res = await fetch(`${QLOO_BASE_URL}/v2/insights/?filter.type=urn:entity:movie&filter.tags=urn:tag:genre:media:comedy&filter.release_year.min=2022&take=1`, { headers: { "X-Api-Key": key } });
      if (res.status === 401 || res.status === 403) throw new Error("Invalid API key");
      const remaining = res.headers.get("x-month-ratelimit-remaining");
      if (remaining === null) throw new Error(`No quota headers (HTTP ${res.status}): ${(await res.text()).slice(0, 200)}`);
      const resetSec = res.headers.get("x-month-ratelimit-reset");
      $("remaining").textContent = fmt(remaining);
      $("total").textContent = fmt(res.headers.get("x-month-ratelimit-limit"));
      $("days").textContent = resetSec === null ? "—" : Math.floor(resetSec / 86400);
      $("stats").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(err instanceof TypeError ? "Network error" : err.message, true);
    }
  });
</script>
</body>
</html>
